[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symmclimatenet"
version = "1.0.0"
description = "Symmetry-Guided Spatio-Temporal Climate Network"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Dimitrios Galiatsatos"}]
keywords = ["climate", "forecasting", "deep-learning", "symmetry", "spatiotemporal", "pytorch"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
symmclimatenet = "symmclimatenet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["symmclimatenet*", "stable_climate_net*"]
